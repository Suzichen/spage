name: Publish @s-page/core

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install
        working-directory: .

      - name: Build
        run: bun run build:all

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # A prerelease must not take over the `latest` dist-tag: 0.6.11-beta.1 → --tag beta
          DIST_TAG=$(node -p "const v=require('./package.json').version; v.includes('-') ? v.split('-')[1].split('.')[0] : 'latest'")
          echo "Publishing $(node -p "require('./package.json').version") with dist-tag $DIST_TAG"
          npm publish --access public --tag "$DIST_TAG"
