name: Build & Publish create-spage

on:
  push:
    tags:
      - 'create-v*'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm-dir: npm/win32-x64-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            npm-dir: npm/darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            npm-dir: npm/linux-x64-gnu

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/create-spage

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install

      - name: Build native module
        run: bunx @napi-rs/cli build --platform --release --target ${{ matrix.target }}

      - name: List build output
        shell: bash
        run: ls -la *.node 2>/dev/null || echo "No .node files found"

      - name: Copy artifact to platform package
        shell: bash
        run: |
          cp create-spage.*.node ${{ matrix.npm-dir }}/ 2>/dev/null || true
          ls -la ${{ matrix.npm-dir }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/create-spage/${{ matrix.npm-dir }}/create-spage.*.node
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/create-spage
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Build TypeScript
        run: bun run build

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/create-spage/artifacts

      - name: Move artifacts to platform packages
        shell: bash
        run: |
          for dir in artifacts/bindings-*; do
            target=$(basename "$dir" | sed 's/bindings-//')
            case "$target" in
              x86_64-pc-windows-msvc)   dest="npm/win32-x64-msvc" ;;
              aarch64-apple-darwin)     dest="npm/darwin-arm64" ;;
              x86_64-unknown-linux-gnu) dest="npm/linux-x64-gnu" ;;
              *) echo "Unknown target: $target"; continue ;;
            esac
            find "$dir" -name '*.node' -exec cp {} "$dest"/ \;
            echo "Copied $target -> $dest"
            ls -la "$dest"/
          done

      - name: Publish platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # A prerelease must not take over the `latest` dist-tag: 0.6.9-beta.1 → --tag beta
          DIST_TAG=$(node -p "const v=require('./package.json').version; v.includes('-') ? v.split('-')[1].split('.')[0] : 'latest'")
          echo "Using dist-tag $DIST_TAG"
          for pkg in npm/*/; do
            if [ -f "$pkg/package.json" ]; then
              cd "$pkg"
              SPEC="$(node -p "const p=require('./package.json'); p.name + '@' + p.version")"
              # Only an already-published version is tolerated; auth, network and tag errors must fail.
              if npm view "$SPEC" version > /dev/null 2>&1; then
                echo "$SPEC already published — skipping"
              else
                echo "Publishing $SPEC ..."
                npm publish --access public --tag "$DIST_TAG"
              fi
              cd -
            fi
          done

      - name: Publish main package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          DIST_TAG=$(node -p "const v=require('./package.json').version; v.includes('-') ? v.split('-')[1].split('.')[0] : 'latest'")
          SPEC="$(node -p "const p=require('./package.json'); p.name + '@' + p.version")"
          if npm view "$SPEC" version > /dev/null 2>&1; then
            echo "$SPEC already published — skipping"
          else
            echo "Publishing $SPEC with dist-tag $DIST_TAG"
            npm publish --access public --tag "$DIST_TAG"
          fi
